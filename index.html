<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hidratify - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Manrope', -apple-system, 'Helvetica Neue', sans-serif; }
    .brand-num { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-[oklch(96.5%_0.008_240)] p-4">
  <div class="bg-white p-8 rounded-3xl shadow-[0_8px_32px_oklch(0%_0_0/0.06)] w-full max-w-sm">
    <div class="flex flex-col items-center gap-2 mb-8">
      <div class="w-14 h-14 rounded-2xl bg-[oklch(94%_0.03_220)] flex items-center justify-center">
        <i class="fa-solid fa-droplet text-xl text-[oklch(45%_0.12_220)]"></i>
      </div>
      <h1 class="text-xl font-bold text-[oklch(20%_0.02_240)]">Hidratify</h1>
      <p class="text-sm text-[oklch(55%_0.02_240)]">Registrá tu hidratación y diuresis diaria</p>
    </div>

    <div class="flex flex-col gap-3 mb-5">
      <input id="email" type="email" placeholder="Email"
        class="w-full p-3 border border-[oklch(90%_0.01_240)] rounded-xl text-sm outline-none focus:border-[oklch(55%_0.12_220)] transition-colors" />
      <input id="password" type="password" placeholder="Contraseña"
        class="w-full p-3 border border-[oklch(90%_0.01_240)] rounded-xl text-sm outline-none focus:border-[oklch(55%_0.12_220)] transition-colors" />
    </div>

    <div class="flex gap-3 mb-2">
      <button onclick="login()" class="flex-1 bg-[oklch(45%_0.12_220)] text-white py-3 rounded-xl font-semibold text-sm">Ingresar</button>
      <button onclick="register()" class="flex-1 bg-[oklch(95%_0.01_240)] text-[oklch(30%_0.02_240)] py-3 rounded-xl font-semibold text-sm">Registrarse</button>
    </div>

    <div id="popup" class="hidden p-3 rounded-xl text-center text-sm mt-4"></div>
  </div>

  <script src="app/firebase-config.js"></script>
  <script src="app/auth.js"></script>
</body>
</html>
